                    Get back on its feet after a fall (RecoveryStand) (on the robot of the open drive session). Answers {dryRun,
                    sent, command, robot, sends, mode}; 409 with no drive session, or while an overheat warning is up
                x-when: the robot has fallen over and should get up
                requestBody:
                    content:
                        application/json:
