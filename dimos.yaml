title: Go2 Ctrl
spec-version: v1.0 # the dimos.yaml spec version this file follows
uses:
    "@dimos-gateway":
        - GET /runs
        - POST /runs
        - POST /runs/stop
        - GET /global-config
        - PUT /global-config
    "@desktop-gateway":
        - GET /api/apps
        - PUT /api/launcher/state
        - POST /api/desktop/shell
        - GET /api/desktop/shell/{id}
        - POST /api/desktop/shell/{id}/cancel
    # the dim-app SDK's zenoh client (backend state, events): the zenoh bridge and how it finds it
    "@zenoh-gateway": ">=0.4 <0.5"
caches:
    - url: "https://dimos-desktop.cachix.org"
      key: "dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ="
provides:
    # what its server answers only its own pages (its endpoints: below are the public API)
    private:
        - api/state/*
        - api/drive/*
        - api/launch/*
        - api/setup/*
        - api/accounts/*
        - api/robots/*
        - api/wifi/*
        - api/network/*
        - api/scan/*
        - api/check-ip
        - api/events/*
    description: >-
        Unitree Go2 robot dogs: find them (Bluetooth + LAN scan), put one on Wi-Fi over Bluetooth, and drive one live
        (stand, sit, jump, dance, walk) over WebRTC. Robot-moving and Wi-Fi-changing endpoints take dryRun: true.
    endpoints:
        - description: >-
              Everything at once: scanned robots, scan status, Wi-Fi provisioning, the drive session, this computer's Wi-Fi,
              Unitree accounts, the robot commands
          method: GET
          path: api/state
          role: context
        - description: "The robots found by the last scan (name, serial, Bluetooth id, IP, whether its AES key is saved)"
          method: GET
          path: api/robots
        - description: One robot
          method: GET
          params:
              key:
                  description: 'the robot''s key from GET api/robots (its serial, else Bluetooth id, else IP)'
                  required: true
                  type: string
          path: "api/robots/{key}"
        - description: >-
              Scan for Go2s over Bluetooth and the local network (passive: nothing is paired or changed). Forgets the previous
              results; with wait (default) answers when the scan ends
          method: POST
          params:
              timeout:
                  description: seconds to scan (default 7)
                  type: number
              wait:
                  description: answer when the scan ends with the robots found (default true); false answers right away
                  type: boolean
          path: api/scan
        - description: Rename a robot (saved on this computer); an empty name goes back to its Bluetooth name
          method: PUT
          params:
              key:
                  description: 'the robot''s key from GET api/robots (its serial, else Bluetooth id, else IP)'
                  required: true
                  type: string
              name:
                  required: true
                  type: string
          path: "api/robots/{key}/name"
        - description: >-
              Save a robot's per-device AES-128 key (32 hex chars; firmware ≥ 1.1.15 needs it to connect); empty clears it.
              POST api/accounts fetches keys instead
          method: PUT
          params:
              aesKey:
                  required: true
                  type: string
              key:
                  description: 'the robot''s key from GET api/robots (its serial, else Bluetooth id, else IP)'
                  required: true
                  type: string
          path: "api/robots/{key}/aes-key"
        - description: >-
              Set the IP to drive a robot at when the scan can't see it on the network (a VPN, another subnet); empty clears
              it
          method: PUT
          params:
              ip:
                  required: true
                  type: string
              key:
                  description: 'the robot''s key from GET api/robots (its serial, else Bluetooth id, else IP)'
                  required: true
                  type: string
          path: "api/robots/{key}/ip"
        - description: >-
              This computer's Wi-Fi (SSID) and, on macOS, whether LAN discovery's multicast can reach the robots (a VPN can
              hijack it; `fix` is the command that routes it)
          method: GET
          path: api/network
        - description: >-
              Put a robot on a Wi-Fi network: sends the SSID, password and country over Bluetooth, answers once the robot
              accepted them. Use dryRun: true to check without sending
          method: POST
          params:
              country:
                  description: two-letter Wi-Fi country code (default US)
                  type: string
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
              key:
                  description: 'the robot''s key from GET api/robots (its serial, else Bluetooth id, else IP)'
                  required: true
                  type: string
              password:
                  type: string
              ssid:
                  required: true
                  type: string
          path: "api/robots/{key}/wifi"
        - description: >-
              The current or last Wi-Fi provisioning: status (idle, running, ok, error, cancelled, dry-run), robot, SSID and
              its log
          method: GET
          path: api/wifi
        - description: Abort the running Wi-Fi provisioning
          method: POST
          path: api/wifi/cancel
        - description: Forget the last Wi-Fi provisioning result (closes it in the UI)
          method: DELETE
          path: api/wifi
        - description: >-
              The drive session: robot, status (connecting, ready, reconnecting, error), mode (resting, rising, stand, pose),
              velocity, last command
          method: GET
          path: api/drive
        - description: >-
              Connect to a robot for live control and camera (closes any other session); answers when ready. dryRun: true
              opens a simulated session that sends nothing
          method: POST
          params:
              aesKey:
                  description: 'the robot''s AES key for this connection (default: the saved one)'
                  type: string
              dryRun:
                  description: "true: a simulated session — commands and moves are accepted and shown, never sent"
                  type: boolean
              ip:
                  description: 'drive this IP directly (no scan needed), or override the robot''s'
                  type: string
              robot:
                  description: a key from GET api/robots
                  type: string
          path: api/drive/connect
        - description: Close the drive session (stops any move first)
          method: POST
          path: api/drive/disconnect
        - description: >-
              Walk (or, in pose mode, tilt) at a velocity for a while, then stop; a new move replaces the last. Axes are -1..1
              of 0.6 m/s forward, 0.4 m/s sideways, 1.1 rad/s turning (×2.2 with run). Needs stand first
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
              durationMs:
                  description: "how long, 100..5000 (default 500)"
                  type: number
              forward:
                  description: "-1..1, positive = forward"
                  type: number
              run:
                  description: 2.2× faster
                  type: boolean
              strafe:
                  description: "-1..1, positive = left"
                  type: number
              turn:
                  description: "-1..1, positive = turn left"
                  type: number
          path: api/drive/move
        - description: Stop moving now
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/stop
        - description: 'For pages: a WebRTC offer (receive-only video) in, the answer that streams the robot''s camera out'
          method: POST
          params:
              sdp:
                  description: the page's SDP offer
                  required: true
                  type: string
          path: api/drive/video
        - description: Saved Unitree app accounts (the AES keys come from them) and the robots bound to each
          method: GET
          path: api/accounts
        - description: Save a Unitree app account (on this computer only) and pull the AES key of every robot bound to it
          method: POST
          params:
              email:
                  required: true
                  type: string
              password:
                  required: true
                  type: string
          path: api/accounts
        - description: Sign in again and refresh the AES keys of the robots bound to a saved account
          method: POST
          params:
              email:
                  required: true
                  type: string
          path: "api/accounts/{email}/pull"
        - description: Forget a saved account (keys already pulled stay)
          method: DELETE
          params:
              email:
                  required: true
                  type: string
          path: "api/accounts/{email}"
        - description: >-
              The first-run guide: its step (welcome, find, wifi, address, launch, done), mode (robot or replay) and the robot
              picked (key, name, ip, whether its AES key is saved)
          method: GET
          path: api/setup
        - description: >-
              Move the first-run guide: any of step, robot (a key from GET api/robots; empty forgets it), ip (that robot's IP,
              saved for it; with no robot, the robot is that IP) and mode
          method: PUT
          params:
              ip:
                  description: the picked robot's IPv4 address
                  type: string
              mode:
                  description: "robot, or replay (no robot: try a recording)"
                  type: string
              robot:
                  description: a key from GET api/robots; empty forgets the picked robot
                  type: string
              step:
                  description: "welcome, find, wifi, address, launch or done"
                  type: string
          path: api/setup
        - description: "Start the first-run guide over (robots, names and keys stay)"
          method: DELETE
          path: api/setup
        - description: "Whether a Go2 answers at an IP: opens and closes a connection to its WebRTC signaling port (9991), sends nothing"
          method: POST
          params:
              ip:
                  required: true
                  type: string
          path: api/check-ip
        - description: >-
              {launch}: Desktop's dimos launch (blueprint, phase starting/running/stopped/failed, startup steps, problems), or
              null
          method: GET
          path: api/launch
        - description: >-
              Launch dimos through Desktop for the guide's robot (robot_ip, plus its saved AES key) or a replay; one launch at
              a time (a running one answers 409: POST api/launch/stop first). dryRun: true says what it would send
          method: POST
          params:
              blueprint:
                  description: default unitree-go2-basic
                  type: string
              default:
                  description: 'also save robot_ip in Desktop''s global config, for the Launcher''s launches'
                  type: boolean
              dryRun:
                  description: "true: say what would be launched, launch nothing"
                  type: boolean
              ip:
                  description: 'the robot''s IP (default: the guide''s robot)'
                  type: string
              replay:
                  description: play a recording instead of connecting to a robot
                  type: boolean
          path: api/launch
        - description: Stop Desktop's dimos launch
          method: POST
          path: api/launch/stop
        - description: >-
              Stand up and balance, ready to walk (StandUp, wait 3 s, BalanceStand); api/drive/move needs this first (on the
              robot of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/stand
        - description: >-
              Balance-stand in pose mode: api/drive/move then tilts/turns the body in place instead of walking (on the robot
              of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/pose
        - description: Sit down (the robot can't walk until it stands again) (on the robot of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/sit
        - description: Lie down (StandDown) (on the robot of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/lie_down
        - description: Jump forward (FrontJump) — needs clear space in front (on the robot of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/jump
        - description: Wave a front paw (on the robot of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/hello
        - description: Stretch (on the robot of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/stretch
        - description: Get back on its feet after a fall (RecoveryStand) (on the robot of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/recover
        - description: Go limp and lie down (Damp) (on the robot of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/relax
        - description: Get up from sitting (RiseSit) (on the robot of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/rise_sit
        - description: Dance routine 1 (on the robot of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/dance1
        - description: Dance routine 2 (on the robot of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/dance2
        - description: Wiggle its hips (on the robot of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/wiggle_hips
        - description: Make a heart with its front paws (on the robot of the open drive session)
          method: POST
          params:
              dryRun:
                  description: "true: check everything and say what would be sent, without touching the robot"
                  type: boolean
          path: api/drive/finger_heart
nix:
    cache:
        aarch64-linux:
            - packages.aarch64-darwin.dimosApp-aarch64-linux
            - packages.x86_64-linux.dimosApp-aarch64-linux
        x86_64-linux:
            - packages.aarch64-darwin.dimosApp-x86_64-linux
