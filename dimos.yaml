                    Jump forward (FrontJump) — needs clear space in front (on the robot of the open drive session). Answers
                    {dryRun, sent, command, robot, sends, mode}; 409 with no drive session, or while an overheat warning is
                    up
                x-when: the robot should jump forward
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    dryRun:
                                        description: "true: check everything and say what would be sent, without touching
                                            the robot"
                                        type: boolean
        /api/drive/hello:
