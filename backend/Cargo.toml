[package]
name = "go2_dash"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
description = "dim-go2-dash backend: Go2 discovery, Wi-Fi provisioning and live control, every action an HTTP endpoint"

[[bin]]
name = "dimos-app-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
btleplug = "0.12"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cfb-mode = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
rsa = "0.9"
md5 = "0.7"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
webrtc = "0.12"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
