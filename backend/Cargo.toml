[package]
name = "go2_dash"
version = "0.5.20"
edition = "2021"
rust-version = "1.89"
description = "dim-go2-dash backend: Go2 discovery, Wi-Fi provisioning and live control, every action an HTTP endpoint"

[[bin]]
name = "dimos-app-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
btleplug = "0.12"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cfb-mode = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
rsa = "0.9"
md5 = "0.7"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
webrtc = "0.12"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
regex = "1"
libc = "0.2"
# recordings: dimos' own recorder stores (a memory .db, or an mcap in the dimos layout) of dimos' LCM types
dimos-memory-recorder = { git = "https://github.com/dimensionalOS/dimos.git", rev = "1e7b4918bc626de4fa6592fb023d4b3aee932754" }
# recovering a killed run's mcap
mcap = { version = "0.25.0", default-features = false, features = ["zstd"] }
# a .db's stream registry and recovery; bundled SQLite, also for the recorder's (same version, so one libsqlite3-sys)
rusqlite = { version = "0.40", features = ["bundled"] }
# the recorder's branch, so both use one lcm-msgs
lcm-msgs = { git = "https://github.com/dimensionalOS/dimos-lcm.git", branch = "rust-codegen" }
memmap2 = "0.9"
# the lidar's voxel map arrives LZ4-compressed
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode", "std", "frame"] }
# the camera arrives as H.264: decoded and stored as JPEG CompressedImage
openh264 = { version = "=0.9.3", features = ["source"] }
jpeg-encoder = "0.6"
bytes = "1"
async-trait = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-location = "0.3"
objc2-core-wlan = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", optional = true }

[features]
# compile libdbus in (for the static cross build in flake.nix), instead of linking the system's
vendored-dbus = ["dbus/vendored"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
