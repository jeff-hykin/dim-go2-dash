name: ci
on:
    push:
    pull_request:
    workflow_dispatch:
jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-14]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: cachix/install-nix-action@v31
            # pulls from dimos-desktop.cachix.org; pushes what it builds only when the CACHIX_AUTH_TOKEN secret is set
            - uses: cachix/cachix-action@v16
              with:
                  name: dimos-desktop
                  authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
            # builds the frontend (tsc + vite) and the Rust backend, running its route tests (mock app, no hardware)
            - run: nix build .#dimosApp -L
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.5.0 # the formatter changes between releases: pin the one `deno fmt` runs with locally
            # dimos.yaml's agent: == the endpoints the built server serves
            - run: deno task check-endpoints
            - run: deno fmt --check && deno lint
